name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check formatting
        run: pnpm fmt:check
      - name: Typecheck packages
        run: pnpm typecheck
      - name: Build application and package
        run: pnpm build
      - name: Validate Cloudflare deployment
        run: pnpm --dir apps/website exec wrangler deploy --dry-run
